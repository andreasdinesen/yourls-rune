gameskill:
  id: yourls
  name: "YOURLS"
  category: "Apps"
  description: "Din egen URL-forkorter (yourls.org). Database er indbygget — ingen separat DB-rune. Log ind på /admin/. Sæt admin-bruger/kode nedenfor; slå AUTO_UPDATE til for at hente nyeste YOURLS ved opstart."
  author: "andreasdinesen"
  version: 19
  icon: "app"

  # All-in-one image (YOURLS + MariaDB + supervisor). Runs its own entrypoint as
  # root so MariaDB and Apache can start; only /data is persisted.
  docker:
    image: "ghcr.io/andreasdinesen/yourls-rune:{{IMAGE_TAG}}"
    keep_entrypoint: true
    data_path: "/data"
    user: "0:0"

  install:
    image: "ghcr.io/andreasdinesen/yourls-rune:{{IMAGE_TAG}}"
    script: |
      mkdir -p /data
      echo "Klar. Tryk Start, vent lidt, og log ind paa /admin/ med din admin-bruger."

  # "Opdater YOURLS"-knap på serversiden. Henter nyeste STABILE udgivelse og
  # vælger den; genstarten bagefter tager den i brug. TAG EN BACKUP FØRST.
  update:
    image: "ghcr.io/andreasdinesen/yourls-rune:{{IMAGE_TAG}}"
    label: "Opdater YOURLS til nyeste"
    script: |
      /usr/local/bin/update-yourls.sh

  variables:
    # Image-version (runens, ikke YOURLS-kernens - det er YOURLS_VERSION nedenfor).
    # "latest" foelger med hver udgivelse, "v18" laaser serveren til runens
    # version 18. Panelet henter imaget (docker pull) ved hver Start/Restart, saa
    # med latest er hver Restart ogsaa en opdatering. Et vN-tag genbygges IKKE af
    # den ugentlige koersel. docker.image, install.image og update.image SKAL
    # bruge samme tag. Versions-taggene findes fra den udgivelse, der indfoerte
    # feltet; aeldre versioner findes kun som latest.
    #
    # Feltet maa ALDRIG staa tomt - panelet bruger IKKE default for en tom vaerdi
    # (yggdrasil @ddcf9d2; rune-schema.md:348/:388 lover det, koden goer det ikke):
    #  1. validateVar returnerer ok paa "" (internal/api/env_validate.go:61-63)
    #     FOER type- og pattern-tjekket (:65-113), saa moenstret afviser aldrig "".
    #  2. `required` haandhaeves ikke server-side (samme fil :57-60); det giver kun
    #     stjernen i formularen (web/src/components/VarForm.svelte:41).
    #  3. "" gemmes og vinder over default (create: handlers_servers.go:324-327,
    #     start/install: handlers_query_rcon.go:50-51), saa imaget bliver "...:"
    #     og pull/create fejler (handlers_servers.go:828-887, install.go:150-198).
    #     Install-scriptet koerer i samme image og naar aldrig at melde fejlen.
    # Derfor required (stjerne) og "aldrig tomt" i feltnavnet. Staar feltet tomt:
    # skriv latest, gem og tryk Restart.
    - key: IMAGE_TAG
      name: "Image-version (runens): latest (foelger nyeste) eller fx v18 for at laase/rulle tilbage. Ikke det samme som YOURLS-versionen nedenfor - aldrig tomt, skriv latest hvis i tvivl"
      type: string
      required: true
      default: "latest"
      pattern: '^(latest|v[0-9]+)$'
      hint: "Skriv latest eller et runeversionsnummer som v18"
    - key: YOURLS_USER
      name: "Admin-brugernavn"
      type: string
      default: "admin"
      required: true
    - key: YOURLS_PASS
      name: "Admin-adgangskode (skjules)"
      type: string
      default: ""
      required: true
      secret: true
    # Only set this once DNS + a reverse proxy actually point at this container:
    # it tells YOURLS its own address, it does not make the domain work. Setting
    # it to a domain that isn't reachable yet locks you out of port access too.
    - key: YOURLS_SITE
      name: "Site-URL — lad stå TOM (anbefalet: adressen auto-detekteres). Skal du sætte den, brug det FULDE domæne med https://, fx https://yourls.dine.dk — IKKE bare 'yourls'. Kun når DNS + reverse proxy peger herpå"
      type: string
      default: ""
    - key: YOURLS_PRIVATE
      name: "Privat — kræv login for at oprette links (anbefalet)"
      type: bool
      default: true
    - key: AUTO_UPDATE
      name: "Hent nyeste YOURLS fra GitHub ved hver opstart (ellers følger imagets version). Opdaterer også plugins nedenfor"
      type: bool
      default: false
    # Pin an EXACT version (or roll back). Wins over the Update button and
    # AUTO_UPDATE. Leave empty to let the Update button / image decide. Live
    # status is written to Console + /data/YOURLS-VERSION.txt.
    - key: YOURLS_VERSION
      name: "YOURLS-version (avanceret) — tom anbefales; brug 'Opdater YOURLS'-knappen i stedet. Sæt fx 1.10.6 for at pinne/rulle tilbage. Vinder over knappen. Status står i Console-loggen og i YOURLS-VERSION.txt under Files"
      type: string
      default: ""
    # Unlike PLUGINS, this one both installs AND activates — it is a feature
    # switch, so the toggle is authoritative and re-applied on every start.
    - key: QR_CODE
      name: "QR-koder — tilføj .qr til en kort-URL for at se dens QR-kode (fx /abc.qr). Bemærk: QR-billedet hentes fra api.qrserver.com, som logger IP og referrer"
      type: bool
      default: false
    # Downloaded on start into the persisted user/plugins dir. Never auto-enabled
    # — the user activates them in the admin, which stores it in the database.
    - key: PLUGINS
      name: "Plugins — GitHub owner/repo adskilt med komma, fx: YOURLS/antispam, MatthewC/yourls-2fa-support. Find dem på github.com/YOURLS/awesome. Aktivér dem bagefter under Manage Plugins"
      type: string
      default: ""
    - key: YOURLS_LANG
      name: "Sprog, fx da_DK (kræver .mo-fil i user/language; tom = engelsk)"
      type: string
      default: ""
    - key: YOURLS_URL_CONVERT
      name: "Nøgleformat: 36 = kun små bogstaver, 62 = blandet"
      type: select
      options: ["36", "62"]
      default: "36"

  # Empty command + keep_entrypoint => the image's ENTRYPOINT (supervisord) runs.
  # Apache logs "AH00094: Command line: ..." once it is serving.
  startup:
    command: ""
    done_regex: 'Command line:'

  ports:
    - { name: web, default: 8080, protocol: tcp }

  # Standard-overvaagning (Kvasir-watchers). Laegges ind ved oprettelse og ved
  # Reinstall - en eksisterende server faar dem foerst efter en Reinstall.
  watchers:
    # MariaDB's fejllog skriver "[ERROR]" (samme moenster som yggdrasils egen
    # mariadb-rune). Enkelte linjer kan komme ved en uren nedlukning, derfor en
    # taerskel.
    - name: "Databasefejl (MariaDB)"
      pattern: '\[ERROR\]|MariaDB startede ikke i tide'
      threshold: 3
      window_secs: 120
    # Apache i det officielle php/yourls-image logger PHP-fejl til stderr. Bots,
    # der kalder en include-fil direkte, giver enkelte fatals - et virkeligt
    # nedbrud gentager sig paa hvert kald.
    - name: "PHP fatal errors"
      pattern: 'PHP Fatal error'
      threshold: 3
      window_secs: 300

  backup:
    # Raw mysql/ files are owned by the container's mysql uid and unreadable for
    # the panel's backup user — and a hot copy would be inconsistent anyway.
    # db-dump/ holds a mysqldump (refreshed every 6 h) which is the restorable copy.
    include: ["user", "db-dump", "secrets", "YOURLS-VERSION.txt"]
